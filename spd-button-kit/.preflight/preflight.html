<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
@layer theme {
  :root {
    --spd-background: #ffffff;
    --spd-foreground: #1f2937;
    --spd-card: #ffffff;
    --spd-card-foreground: #1f2937;
    --spd-popover: #ffffff;
    --spd-popover-foreground: #1f2937;
    --spd-primary: #2563eb;
    --spd-primary-foreground: #ffffff;
    --spd-secondary: #f3f4f6;
    --spd-secondary-foreground: #374151;
    --spd-muted: #f3f4f6;
    --spd-muted-foreground: #6b7280;
    --spd-accent: #eff6ff;
    --spd-accent-foreground: #1d4ed8;
    --spd-border: #e5e7eb;
    --spd-input: #e5e7eb;
    --spd-ring: #2563eb;

    --spd-state-success: #10b981;
    --spd-state-success-foreground: #ffffff;
    --spd-state-warning: #f59e0b;
    --spd-state-warning-foreground: #ffffff;
    --spd-state-error: #ef4444;
    --spd-state-error-foreground: #ffffff;
    --spd-state-info: #3b82f6;
    --spd-state-info-foreground: #ffffff;

    --spd-radius-sm: 4px;
    --spd-radius-md: 8px;
    --spd-radius-lg: 12px;
    --spd-radius-pill: 999px;

    --spd-font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif;
    --spd-font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

    --spd-shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --spd-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
    --spd-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    --spd-shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.12);
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--spd-background);
    --color-foreground: var(--spd-foreground);
    --color-card: var(--spd-card);
    --color-card-foreground: var(--spd-card-foreground);
    --color-popover: var(--spd-popover);
    --color-popover-foreground: var(--spd-popover-foreground);
    --color-primary: var(--spd-primary);
    --color-primary-foreground: var(--spd-primary-foreground);
    --color-secondary: var(--spd-secondary);
    --color-secondary-foreground: var(--spd-secondary-foreground);
    --color-muted: var(--spd-muted);
    --color-muted-foreground: var(--spd-muted-foreground);
    --color-accent: var(--spd-accent);
    --color-accent-foreground: var(--spd-accent-foreground);
    --color-border: var(--spd-border);
    --color-input: var(--spd-input);
    --color-ring: var(--spd-ring);
    --radius-sm: var(--spd-radius-sm);
    --radius-md: var(--spd-radius-md);
    --radius-lg: var(--spd-radius-lg);
  }
  @layer base {
    body { background: var(--spd-background); color: var(--spd-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;

</head>

  <main>preflight</main>
