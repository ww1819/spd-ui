<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPD 医疗耗材供应链管理平台 · 登录预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1e6fdb;
      --color-primary-dark: #1558b0;
      --color-text: #1f2937;
      --color-text-secondary: #6b7280;
      --color-border: rgba(255, 255, 255, 0.55);
      --card-bg: rgba(255, 255, 255, 0.74);
      --card-shadow: 0 24px 60px rgba(30, 111, 219, 0.14), 0 8px 24px rgba(0, 0, 0, 0.08);
      --input-bg: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--color-text);
    }

    .login-stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      background: #eef6ff;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: url("../spd-login-background/assets/login-bg-dynamic-light-rays.jpg");
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .light-ray {
      position: fixed;
      top: -40%;
      left: -30%;
      width: 80%;
      height: 180%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 38%,
        rgba(255, 255, 255, 0.22) 45%,
        rgba(255, 255, 255, 0.38) 50%,
        rgba(255, 255, 255, 0.22) 55%,
        rgba(255, 255, 255, 0) 62%
      );
      transform: rotate(18deg);
      filter: blur(18px);
      pointer-events: none;
      z-index: 1;
      animation: raySweep 7s ease-in-out infinite;
    }

    .light-ray-delayed {
      animation-delay: 3.5s;
      opacity: 0.6;
      top: -20%;
      left: -10%;
      width: 60%;
    }

    @keyframes raySweep {
      0% {
        transform: translateX(-80vw) rotate(18deg);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.7;
      }
      100% {
        transform: translateX(100vw) rotate(18deg);
        opacity: 0;
      }
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      animation: floatUp 12s linear infinite;
    }

    .particle:nth-child(1) { left: 12%; animation-duration: 10s; animation-delay: 0s; opacity: 0.7; }
    .particle:nth-child(2) { left: 28%; animation-duration: 14s; animation-delay: 2s; opacity: 0.5; }
    .particle:nth-child(3) { left: 45%; animation-duration: 11s; animation-delay: 4s; opacity: 0.6; }
    .particle:nth-child(4) { left: 62%; animation-duration: 13s; animation-delay: 1s; opacity: 0.4; }
    .particle:nth-child(5) { left: 78%; animation-duration: 15s; animation-delay: 3s; opacity: 0.5; }
    .particle:nth-child(6) { left: 88%; animation-duration: 9s; animation-delay: 5s; opacity: 0.7; }

    @keyframes floatUp {
      0% {
        bottom: -10%;
        transform: translateX(0) scale(0.6);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        bottom: 110%;
        transform: translateX(24px) scale(1.1);
        opacity: 0;
      }
    }

    .login-card {
      position: relative;
      z-index: 2;
      width: 420px;
      max-width: calc(100vw - 48px);
      margin-right: 8vw;
      padding: 42px 38px 36px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--color-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      animation: cardEnter 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: translateY(24px);
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e6fdb, #4aa3f5);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 8px 18px rgba(30, 111, 219, 0.28);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--color-text);
    }

    .brand-text p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(30, 111, 219, 0.25), transparent);
      margin: 26px 0;
      border: none;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 16px;
      border: 1px solid rgba(30, 111, 219, 0.18);
      border-radius: 10px;
      background: var(--input-bg);
      font-size: 15px;
      color: var(--color-text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .form-input::placeholder {
      color: #9ca3af;
    }

    .form-input:focus {
      border-color: var(--color-primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(30, 111, 219, 0.1);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .forgot {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot:hover {
      color: var(--color-primary-dark);
    }

    .btn-login {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--color-primary), #3b93f7);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(30, 111, 219, 0.32);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(30, 111, 219, 0.38);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    .footer p {
      margin: 0 0 4px;
    }

    @media (max-width: 768px) {
      .login-stage {
        justify-content: center;
        padding: 24px;
      }

      .login-card {
        margin-right: 0;
        width: 100%;
        max-width: 420px;
        padding: 32px 26px 28px;
      }

      .brand-text h1 {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <div class="login-stage">
    <div class="bg-layer" aria-hidden="true"></div>

    <div class="light-ray" aria-hidden="true"></div>
    <div class="light-ray light-ray-delayed" aria-hidden="true"></div>

    <div class="particles" aria-hidden="true">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <main class="login-card" role="main" aria-label="登录">
      <div class="brand">
        <div class="brand-icon">SPD</div>
        <div class="brand-text">
          <h1>医疗耗材供应链管理平台</h1>
          <p>SPD Medical Supply Management</p>
        </div>
      </div>

      <hr class="divider" />

      <form autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="org">组织机构</label>
          <select id="org" class="form-input">
            <option value="">请选择组织机构</option>
            <option value="1">XX 市人民医院</option>
            <option value="2">XX 中心医院</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">账号</label>
          <input id="username" type="text" class="form-input" placeholder="请输入账号" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input id="password" type="password" class="form-input" placeholder="请输入密码" />
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" />
            <span>记住密码</span>
          </label>
          <a href="#" class="forgot">忘记密码？</a>
        </div>

        <button type="button" class="btn-login">登 录</button>
      </form>
    </main>

    <footer class="footer">
      <p>前端 v2.x · 后端 v2.x</p>
      <span>Copyright © 2018-2023 spd.vip All Rights Reserved.</span>
    </footer>
  </div>
</body>
</html>
